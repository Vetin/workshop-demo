# Codex profile definitions for the OpenTelemetry Demo workshop.
#
# These profiles configure the Codex reviewers used by the SDD pipeline
# (design-plan-codex-review-subagent and impl-plan-codex-review-subagent skills).
#
# SETUP: merge these profiles into ~/.codex/config.toml, adjusting the
# PROJECT_ROOT prefix to wherever this repo is checked out:
#
#   cat .codex/config.toml >> ~/.codex/config.toml
#
# Or run the helper:
#   .codex/setup.sh /path/to/this/repo

[profiles.codex-review-architecture]
